<!DOCTYPE html>
<html>
    <body>
        <h2>Months</h2>
        <p id="demo"></p>
        <script>
            var Months = ["January", "Febuary", "March", "April", "May Fruit", "June", "July", "Augest", "September", "October", "November", "December"];
            var text = "";
            var i;
            for (i=0; i < Months.length; i++) {
                text += Months[i] + "<br>"
            }
            document.getElementById("demo").innerHTML = text;
        </script>
        </body>
        </html>
