    <body>
        <h1>5+5=</h1>
        <p>Sum of two Numbers</p>
        <p id="result"></p>
        <script>
            var num1 = 5;
            var num2 = 6;
            var sum = num1 + num2;
            document.getElementById("result").innerHTML = 
            "The total sum is " + sum;

            </script>
        <button onclick="myfunction(5,5)">Multiply 5x5</button>
        <script>
            function myfunction(x, y)
            {
                if (y=== undefined) {
                    y=2;
                }
                document.write(x*y);
            }
            </script>
    </body>
